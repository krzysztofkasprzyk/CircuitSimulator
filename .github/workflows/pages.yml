name: Publikacja GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v6

      - name: Przygotowanie statycznej aplikacji
        run: |
          mkdir _site
          cp index.html _site/
          cp -R css js _site/
          cp przykladowy-uklad-blokady.json _site/

      - name: Konfiguracja GitHub Pages
        uses: actions/configure-pages@v5

      - name: Spakowanie strony
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publikacja
        id: deployment
        uses: actions/deploy-pages@v4

